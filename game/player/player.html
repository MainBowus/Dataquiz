<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizDATA – Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="navbar.css" />
  <link rel="stylesheet" href="../../css/player.css" />
</head>
<body>

  <div id="navbar"></div>
  
  <div class="screen waiting-screen active" id="screen-waiting">

    <!-- Top bar -->
    <div class="top-bar">
      <div class="badge-pill">Multiple Choice</div>
      <div class="badge-pill" id="q-progress">1 of 10</div>
    </div>

    <!-- Center -->
    <div class="waiting-center">
      <div class="waiting-title">Waiting for host to start</div>

      <div class="waiting-icon">
        <!-- People icon -->
        <svg viewBox="0 0 48 48" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="16" r="6"/>
          <path d="M6 40c0-7 5-12 12-12h1"/>
          <circle cx="32" cy="16" r="6"/>
          <path d="M44 40c0-7-5-12-12-12h-1"/>
          <path d="M18 40c0-7 3-12 6-12s6 5 6 12"/>
        </svg>
      </div>

      <div class="waiting-sub">Sit back and relax</div>
    </div>

    <!-- Progress bar -->
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:25%"></div>
    </div>

    <!-- Footer -->
    <div class="player-footer">
      <div class="footer-name" id="footer-name">Username</div>
      <div class="footer-pin"  id="footer-pin">PIN : 0000000</div>
      <div class="footer-score" id="footer-score">Score XXX</div>
    </div>

  </div>

  <!-- ====== QUESTION SCREEN ====== -->
  <div class="screen question-screen" id="screen-question">

    <div class="top-bar">
      <div class="badge-pill">Multiple Choice</div>
      <div class="badge-pill" id="q-progress-2">1 of 10</div>
    </div>

    <div class="question-text-area" id="q-text">
      Question goes here?
    </div>

    <div class="answer-choices">
      <button class="choice-btn cyan"   onclick="selectAnswer(0)"></button>
      <button class="choice-btn pink"   onclick="selectAnswer(1)"></button>
      <button class="choice-btn purple" onclick="selectAnswer(2)"></button>
      <button class="choice-btn yellow" onclick="selectAnswer(3)"></button>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill-2" style="width:25%"></div>
    </div>

    <div class="player-footer">
      <div class="footer-name" id="footer-name-2">Username</div>
      <div class="footer-pin"  id="footer-pin-2">PIN : 0000000</div>
      <div class="footer-score" id="footer-score-2">Score XXX</div>
    </div>

  </div>

  <script src="../../js/player.js"></script>
  <script src="../../js/global.js"></script>
</body>
</html>
